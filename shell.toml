# Koble Metal shell surfaces: dark steel panels with mint edge light.
# This file replaces Omarchy's generated shell.toml, so every surface is set
# here. Surfaces are translucent; the optional extras blur what shows
# through them. Corner radius follows Hyprland's decoration:rounding (see extras/).

[hyprland]
active-border            = "rgba(b0e0cdff) rgba(4f7a80ee) rgba(4f7a80ee) rgba(b0e0cdff) 45deg"
active-border-foreground = "rgba(8fcbb7cc) rgba(3a5860cc) 45deg"

[bar]
background       = "#081118"
background-alpha = 0.78
text             = "#B8CBC8"
active           = "#C97878"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[controls]
normal-color        = "#C9DCD8"
normal-fill-alpha   = 0.04
normal-border       = "#55747A"
normal-border-width = 1
normal-border-alpha = 0.45

hover-cursor-color        = "#8FCBB7"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#8FCBB7"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.6

focus-color        = "#8FCBB7"
focus-fill-alpha   = 0.10
focus-border       = "#8FCBB7"
focus-border-width = 1
focus-border-alpha = 0.6

# Chosen rows get a mint tint with a lit left edge.
selected-color        = "#8FCBB7"
selected-fill-alpha   = 0.16
selected-border       = "#8FCBB7"
selected-border-width = "0 0 0 2"
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.25
selection-fill-alpha = 0.30

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#0B171F"
background-alpha = 0.84
text             = "#C9DCD8"
border           = "hyprland.active-border"
border-alpha     = 0.9
border-width     = 1

[tooltip]
background       = "#0B171F"
background-alpha = 0.9
text             = "#C9DCD8"
border           = "#55747A"
border-alpha     = 0.8

[notifications]
background       = "#0B171F"
background-alpha = 0.84
text             = "#C9DCD8"
border           = "hyprland.active-border"
border-alpha     = 0.95
border-width     = 1
countdown        = "#8FCBB7"

[launcher]
background                = "#0A151C"
background-alpha          = 0.8
text                      = "#C9DCD8"
border                    = "hyprland.active-border"
border-alpha              = 0.9
scrim                     = "#040A10"
scrim-alpha               = 0.45
selected-background       = "#8FCBB7"
selected-background-alpha = 0.12
selected-text             = "#B0E0CD"
selected-border           = "#8FCBB7"
selected-border-alpha     = 0.7

[menu]
background                = "#0A151C"
background-alpha          = 0.82
text                      = "#C9DCD8"
border                    = "hyprland.active-border"
border-alpha              = 0.9
scrim                     = "#040A10"
scrim-alpha               = 0.45
selected-background       = "#8FCBB7"
selected-background-alpha = 0.12
selected-text             = "#B0E0CD"
selected-border           = "#8FCBB7"
selected-border-alpha     = 0.7

[polkit]
background       = "#0B171F"
background-alpha = 0.88
text             = "#C9DCD8"
text-error       = "#C97878"
border           = "hyprland.active-border"
border-error     = "#C97878"
border-alpha     = 1.0
scrim            = "#040A10"
scrim-alpha      = 0.55
accent           = "#8FCBB7"

[lock]
background       = "#071018"
background-alpha = 0.82
text             = "#C9DCD8"
placeholder      = "#55747A"
text-error       = "#C97878"
border           = "hyprland.active-border"
border-active    = "#8FCBB7"
border-error     = "#C97878"
border-alpha     = 1.0
selection        = "#8FCBB7"
selection-alpha  = 0.4

[image-picker]
scrim                   = "#040A10"
scrim-alpha             = 0.55
text                    = "#C9DCD8"
selected-border         = "#8FCBB7"
selected-border-alpha   = 1.0
unselected-border       = "#55747A"
unselected-border-alpha = 0.5
